name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1" # Можно выбрать нужную версию Node.js

      - name: Install dependencies
        run: npm ci # Устанавливаем зависимости быстро и точно по lock-файлу

      - name: Run Linter
        run: npm run lint # Запускаем скрипт линтинга из package.json

      - name: Zip extension files
        run: zip extension.zip -r . -x '*.git*' -x 'node_modules/*' -x 'package-lock.json'
